[advisories]
version = 2
[licenses]
version = 2
confidence-threshold = 0.9
allow = ["AGPL-3.0-only", "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0", "OpenSSL", "Unlicense", "CDLA-Permissive-2.0"]
[[licenses.exceptions]]
crate = "sqlcipher-src"
allow = ["blessing","WTFPL"]
[bans]
multiple-versions = "warn"
wildcards = "allow"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
