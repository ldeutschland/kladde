name: Local distribution artifacts
on: workflow_dispatch
permissions: {contents: read}
jobs:
  unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24}
      - run: npm install -g pnpm@11.25.0 && pnpm install --frozen-lockfile
      - run: pnpm --filter kladde exec tauri build --no-sign --bundles app
      - run: ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/Kladde.app Kladde-macOS.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kladde-macOS-local
          path: Kladde-macOS.zip
