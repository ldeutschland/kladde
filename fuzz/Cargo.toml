edition="2024"
[package.metadata]
cargo-fuzz=true
[dependencies]
libfuzzer-sys="=0.4.13"
kladde-protocol={path="../crates/kladde-protocol"}
yrs={version="=0.28.1",path="../vendor/yrs"}
