[workspace]
resolver = "2"
members = ["apps/kladde/src-tauri", "crates/kladde-protocol", "crates/kladde-store", "crates/kladde-ai", "crates/kladde-clip", "crates/kladde-crypto", "crates/kladde-sync", "server"]
exclude = ["fuzz", "vendor/yrs"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
argon2 = { version = "=0.5.3" }
axum = { version = "=0.8.9", features = ["ws"] }
base64 = { version = "=0.22.1" }
bip39 = { version = "=2.2.2", features = ["zeroize"] }
chacha20poly1305 = { version = "=0.10.1", features = ["stream"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
dom_query = { version = "=0.28.0", default-features = false }
eventsource-stream = { version = "=0.2.3" }
futures-util = { version = "=0.3.34" }
html5ever = { version = "=0.39.0" }
hex = { version = "=0.4.3" }
hkdf = { version = "=0.12.4" }
kladde-ai = { path = "crates/kladde-ai" }
kladde-clip = { path = "crates/kladde-clip" }
kladde-crypto = { path = "crates/kladde-crypto" }
kladde-protocol = { path = "crates/kladde-protocol" }
kladde-store = { path = "crates/kladde-store" }
kladde-sync = { path = "crates/kladde-sync" }
opaque-ke = { version = "=4.0.1", features = ["argon2"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
proptest = { version = "=1.12.0" }
rand = { version = "=0.8.8" }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "=0.43.0", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = { version = "=0.11.19" }
serde_json = { version = "=1.0.154" }
sha2 = { version = "=0.10.9" }
sqlx-core = { version = "=0.8.6", features = ["_rt-tokio", "_tls-rustls-ring-webpki"] }
sqlx-postgres = { version = "=0.8.6", features = ["uuid","json"] }
subtle = { version = "=2.6.1" }
tauri = { version = "=2.12.5" }
tauri-build = { version = "=2.7.4" }
tempfile = { version = "=3.27.0" }
tendril = { version = "=0.5.1" }
thiserror = { version = "=2.0.21" }
tokio = { version = "=1.54.1", features = ["full"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "=0.7.20" }
url = { version = "=2.5.8" }
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
yrs = { path = "vendor/yrs", version = "=0.28.1" }
