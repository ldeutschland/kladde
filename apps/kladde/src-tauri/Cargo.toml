[package]
name = "kladde"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kladde_app"
crate-type = ["staticlib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
distribution = []
browser-extension = []
native-acceptance = ["kladde-sync/native-acceptance"]

[build-dependencies]
cc = "=1.11.2"
tauri-build.workspace = true

[dependencies]
futures-util.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rand.workspace = true
zeroize.workspace = true
security-framework.workspace = true
kladde-store.workspace = true
kladde-ai.workspace = true
kladde-clip.workspace = true
kladde-sync.workspace = true
kladde-crypto.workspace = true
kladde-protocol.workspace = true
tokio.workspace = true
tokio-util.workspace = true
base64.workspace = true
hex.workspace = true
reqwest.workspace = true
url.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
postcard.workspace = true
quick-xml = "=0.42.0"
zip = { version = "=9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
